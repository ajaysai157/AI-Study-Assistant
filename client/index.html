    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyFlow - AI-Powered Study Assistant. Transform your notes into smarter learning with AI summaries, flashcards, and quizzes." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>!function(){try{var e=localStorage.getItem("theme");if(e==="dark"||(!e&&window.matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}}()</script>
    <title>StudyFlow - AI Study Assistant</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
